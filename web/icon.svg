<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Almanaque">
  <!-- Hoja de almanaque: banda de mes cobalto, perforado, numeral rojo. -->
  <rect width="512" height="512" fill="#F2F0EA"/>
  <rect width="512" height="132" fill="#1B3FA8"/>

  <!-- ojales del troquel -->
  <circle cx="146" cy="66" r="24" fill="#F2F0EA"/>
  <circle cx="366" cy="66" r="24" fill="#F2F0EA"/>

  <!-- perforado -->
  <g fill="#DFDCD2">
    <rect x="40" y="158" width="46" height="9"/>
    <rect x="110" y="158" width="46" height="9"/>
    <rect x="180" y="158" width="46" height="9"/>
    <rect x="250" y="158" width="46" height="9"/>
    <rect x="320" y="158" width="46" height="9"/>
    <rect x="390" y="158" width="46" height="9"/>
  </g>

  <!-- el número: heavy grotesque comprimida, en rojo de calendario -->
  <text x="256" y="404" text-anchor="middle"
        font-family="Archivo, Arial Black, Helvetica, sans-serif"
        font-size="268" font-weight="900" letter-spacing="-14"
        fill="#D8232A">29</text>

  <!-- regla inferior -->
  <rect x="40" y="446" width="432" height="8" fill="#14161C"/>
</svg>
