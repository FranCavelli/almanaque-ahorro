name: Actualizar promos

# Las promos se renuevan casi enteras el día 1 de cada mes y algunas son
# semanales. Dos corridas por día alcanzan de sobra y dejan margen si una falla.
on:
  schedule:
    - cron: '0 9,21 * * *' # 06:00 y 18:00 en Argentina (UTC-3)
  workflow_dispatch: # y a mano cuando quieras

concurrency:
  group: promos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Scrapear fuentes
        run: npm run scrape
        continue-on-error: true # una fuente caída no debe tumbar la corrida

      - name: Normalizar con Claude
        run: npm run normalize
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROMOS_MODEL: ${{ vars.PROMOS_MODEL || 'claude-opus-5' }}
          PROMOS_EFFORT: ${{ vars.PROMOS_EFFORT || 'medium' }}

      - name: Publicar promos.json
        run: npm run build

      - name: Verificar que salió algo
        run: |
          TOTAL=$(node -p "require('./web/promos.json').total")
          echo "Promos publicadas: $TOTAL"
          if [ "$TOTAL" -lt 5 ]; then
            echo "::error::Solo $TOTAL promos. Algo se rompió — no comiteo."
            exit 1
          fi

      - name: Commitear si cambió
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add web/promos.json data/normalized
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "promos: actualización automática $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Guardar el crudo para depurar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_number }}
          path: data/raw/
          retention-days: 7
