name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  # También cuando el job de actualización comitea un promos.json nuevo.
  workflow_run:
    workflows: ['Actualizar promos']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; si entra una nueva mientras hay otra en curso,
# no se cancela la que ya está subiendo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Todo lo que sirve la app vive en web/: HTML, CSS, JS, fuentes,
      # el service worker y el promos.json que comitea el job de actualización.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deploy
        uses: actions/deploy-pages@v4
